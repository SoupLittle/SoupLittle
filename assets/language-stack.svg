<svg
  width="1000"
  height="940"
  viewBox="0 0 1000 940"
  xmlns="http://www.w3.org/2000/svg"
>

  <!-- ===================================================== -->
  <!-- DEFINITIONS                                            -->
  <!-- ===================================================== -->

  <defs>

    <!-- --------------------------------------------------- -->
    <!-- Paper texture                                        -->
    <!-- --------------------------------------------------- -->

    <pattern
      id="paperTexture"
      width="80"
      height="80"
      patternUnits="userSpaceOnUse"
    >

      <circle
        cx="8"
        cy="12"
        r="1.2"
        fill="#6f5138"
        opacity=".10"
      />

      <circle
        cx="42"
        cy="25"
        r="1"
        fill="#6f5138"
        opacity=".08"
      />

      <circle
        cx="67"
        cy="61"
        r="1.3"
        fill="#6f5138"
        opacity=".09"
      />

      <circle
        cx="22"
        cy="70"
        r=".8"
        fill="#6f5138"
        opacity=".08"
      />

      <path
        d="M4 43l2 1M55 8l2-1M72 36l1 2"
        stroke="#6f5138"
        opacity=".07"
      />

    </pattern>


    <!-- --------------------------------------------------- -->
    <!-- Footer dot texture                                   -->
    <!-- --------------------------------------------------- -->

    <pattern
      id="footerDots"
      width="18"
      height="18"
      patternUnits="userSpaceOnUse"
    >

      <circle
        cx="2"
        cy="2"
        r="1.1"
        fill="#f6e9ca"
        opacity=".20"
      />

    </pattern>


    <!-- --------------------------------------------------- -->
    <!-- Rounded clipping area                                -->
    <!-- --------------------------------------------------- -->

    <clipPath id="roundedCard">

      <rect
        x="20"
        y="20"
        width="960"
        height="900"
        rx="22"
      />

    </clipPath>

  </defs>


  <!-- ===================================================== -->
  <!-- OUTER BACKGROUND                                      -->
  <!-- ===================================================== -->

  <rect
    width="1000"
    height="940"
    fill="#f1e2bd"
  />


  <!-- ===================================================== -->
  <!-- CARD                                                   -->
  <!-- ===================================================== -->

  <g clip-path="url(#roundedCard)">

    <!-- --------------------------------------------------- -->
    <!-- Main cream paper                                    -->
    <!-- --------------------------------------------------- -->

    <rect
      x="20"
      y="20"
      width="960"
      height="900"
      fill="#f1e2bd"
    />

    <!-- Paper grain -->
    <rect
      x="20"
      y="20"
      width="960"
      height="900"
      fill="url(#paperTexture)"
    />


    <!-- =================================================== -->
    <!-- HEADER                                               -->
    <!-- =================================================== -->

    <text
      x="55"
      y="70"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="22"
      font-weight="bold"
      letter-spacing="3"
      fill="#c95030"
    >
      MY DIGITAL GARDEN
    </text>


    <text
      x="57"
      y="94"
      font-family="Courier New, monospace"
      font-size="11"
      letter-spacing="1.5"
      fill="#5d4935"
    >
      BUILD · LEARN · AUTOMATE
    </text>


    <text
      x="945"
      y="72"
      text-anchor="end"
      font-family="Courier New, monospace"
      font-size="11"
      letter-spacing="1"
      fill="#5d4935"
    >
      EST. 2023
    </text>


    <!-- Hand-drawn divider -->
    <path
      d="
        M55 115
        C130 110 190 118 260 113
        S390 117 470 112
        S620 117 700 113
        S830 117 945 112
      "
      fill="none"
      stroke="#c95030"
      stroke-width="2"
      opacity=".7"
    />


    <!-- =================================================== -->
    <!-- ABOUT / INTRO                                       -->
    <!-- =================================================== -->

    <text
      x="55"
      y="180"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="62"
      font-weight="900"
      letter-spacing="-3"
      fill="#c95030"
    >
      ABOUT ME
    </text>


    <text
      x="58"
      y="220"
      font-family="Courier New, monospace"
      font-size="13"
      fill="#5d4935"
      letter-spacing="1"
    >
      A PASSIONATE DEVELOPER · MAKER · PROBLEM SOLVER
    </text>


    <!-- --------------------------------------------------- -->
    <!-- Small decorative flower                             -->
    <!-- --------------------------------------------------- -->

    <g transform="translate(900 175)">

      <circle
        cx="0"
        cy="-18"
        r="13"
        fill="#d7a53a"
      />

      <circle
        cx="17"
        cy="-6"
        r="13"
        fill="#d7a53a"
      />

      <circle
        cx="11"
        cy="14"
        r="13"
        fill="#d7a53a"
      />

      <circle
        cx="-11"
        cy="14"
        r="13"
        fill="#d7a53a"
      />

      <circle
        cx="-17"
        cy="-6"
        r="13"
        fill="#d7a53a"
      />

      <circle
        cx="0"
        cy="0"
        r="8"
        fill="#c95030"
      />

    </g>


    <!-- =================================================== -->
    <!-- LANGUAGE STACK                                      -->
    <!-- =================================================== -->

    <text
      x="55"
      y="300"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="53"
      font-weight="900"
      letter-spacing="-2"
      fill="#c95030"
    >
      LANGUAGE
    </text>


    <text
      x="55"
      y="352"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="53"
      font-weight="900"
      letter-spacing="-2"
      fill="#c95030"
    >
      STACK
    </text>


    <text
      x="58"
      y="375"
      font-family="Courier New, monospace"
      font-size="11"
      fill="#5d4935"
      letter-spacing="1"
    >
      WHAT'S GROWING IN MY REPOSITORIES
    </text>


    <!-- --------------------------------------------------- -->
    <!-- The six automatically generated rows go here.       -->
    <!-- --------------------------------------------------- -->

    
    <!-- ================================================ -->
    <!-- LANGUAGE ROW 1: JavaScript -->
    <!-- ================================================ -->

    <!-- Small coloured dot -->
    <circle
      cx="70"
      cy="408"
      r="7"
      fill="#d5a83c"
    />

    <!-- Language name -->
    <text
      x="92"
      y="413"
      font-family="Arial, sans-serif"
      font-size="16"
      font-weight="bold"
      letter-spacing="1"
      fill="#5d4935"
    >JAVASCRIPT</text>

    <!-- Percentage -->
    <text
      x="930"
      y="413"
      text-anchor="end"
      font-family="Courier New, monospace"
      font-size="14"
      font-weight="bold"
      fill="#5d4935"
    >73.9%</text>

    <!-- Empty / background part of bar -->
    <rect
      x="92"
      y="425"
      width="720"
      height="14"
      rx="7"
      fill="#dfcfaa"
    />

    <!-- Actual percentage -->
    <rect
      x="92"
      y="425"
      width="531.9"
      height="14"
      rx="7"
      fill="#d5a83c"
    />


    <!-- ================================================ -->
    <!-- LANGUAGE ROW 2: HTML -->
    <!-- ================================================ -->

    <!-- Small coloured dot -->
    <circle
      cx="70"
      cy="472"
      r="7"
      fill="#c66a43"
    />

    <!-- Language name -->
    <text
      x="92"
      y="477"
      font-family="Arial, sans-serif"
      font-size="16"
      font-weight="bold"
      letter-spacing="1"
      fill="#5d4935"
    >HTML</text>

    <!-- Percentage -->
    <text
      x="930"
      y="477"
      text-anchor="end"
      font-family="Courier New, monospace"
      font-size="14"
      font-weight="bold"
      fill="#5d4935"
    >14.3%</text>

    <!-- Empty / background part of bar -->
    <rect
      x="92"
      y="489"
      width="720"
      height="14"
      rx="7"
      fill="#dfcfaa"
    />

    <!-- Actual percentage -->
    <rect
      x="92"
      y="489"
      width="103.3"
      height="14"
      rx="7"
      fill="#c66a43"
    />


    <!-- ================================================ -->
    <!-- LANGUAGE ROW 3: CSS -->
    <!-- ================================================ -->

    <!-- Small coloured dot -->
    <circle
      cx="70"
      cy="536"
      r="7"
      fill="#b9633d"
    />

    <!-- Language name -->
    <text
      x="92"
      y="541"
      font-family="Arial, sans-serif"
      font-size="16"
      font-weight="bold"
      letter-spacing="1"
      fill="#5d4935"
    >CSS</text>

    <!-- Percentage -->
    <text
      x="930"
      y="541"
      text-anchor="end"
      font-family="Courier New, monospace"
      font-size="14"
      font-weight="bold"
      fill="#5d4935"
    >11.0%</text>

    <!-- Empty / background part of bar -->
    <rect
      x="92"
      y="553"
      width="720"
      height="14"
      rx="7"
      fill="#dfcfaa"
    />

    <!-- Actual percentage -->
    <rect
      x="92"
      y="553"
      width="79.2"
      height="14"
      rx="7"
      fill="#b9633d"
    />


    <!-- ================================================ -->
    <!-- LANGUAGE ROW 4: Python -->
    <!-- ================================================ -->

    <!-- Small coloured dot -->
    <circle
      cx="70"
      cy="600"
      r="7"
      fill="#6f795b"
    />

    <!-- Language name -->
    <text
      x="92"
      y="605"
      font-family="Arial, sans-serif"
      font-size="16"
      font-weight="bold"
      letter-spacing="1"
      fill="#5d4935"
    >PYTHON</text>

    <!-- Percentage -->
    <text
      x="930"
      y="605"
      text-anchor="end"
      font-family="Courier New, monospace"
      font-size="14"
      font-weight="bold"
      fill="#5d4935"
    >0.8%</text>

    <!-- Empty / background part of bar -->
    <rect
      x="92"
      y="617"
      width="720"
      height="14"
      rx="7"
      fill="#dfcfaa"
    />

    <!-- Actual percentage -->
    <rect
      x="92"
      y="617"
      width="8.0"
      height="14"
      rx="7"
      fill="#6f795b"
    />



    <!-- =================================================== -->
    <!-- DIVIDER                                             -->
    <!-- =================================================== -->

    <path
      d="M55 800 H945"
      stroke="#c95030"
      stroke-width="2"
      opacity=".7"
    />


    <!-- =================================================== -->
    <!-- SMALL DEVELOPER QUOTE                               -->
    <!-- =================================================== -->

    <text
      x="55"
      y="830"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="18"
      font-style="italic"
      fill="#5d4935"
    >
      “Build things. Break things. Learn from both.”
    </text>


    <!-- =================================================== -->
    <!-- FOOTER                                              -->
    <!-- =================================================== -->

    <rect
      x="20"
      y="855"
      width="960"
      height="85"
      fill="#c95030"
    />


    <!-- Footer texture -->
    <rect
      x="20"
      y="855"
      width="960"
      height="85"
      fill="url(#footerDots)"
    />


    <text
      x="55"
      y="897"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="24"
      font-weight="bold"
      fill="#f5e7c5"
    >
      MADE WITH CURIOSITY
    </text>


    <text
      x="55"
      y="922"
      font-family="Courier New, monospace"
      font-size="11"
      letter-spacing="1"
      fill="#f5e7c5"
      opacity=".9"
    >
      CULTIVATED ACROSS 49 GITHUB REPOSITORIES
    </text>


    <!-- Decorative star -->
    <text
      x="935"
      y="910"
      text-anchor="middle"
      font-family="Georgia, serif"
      font-size="30"
      fill="#f5e7c5"
    >
      ✦
    </text>

  </g>


  <!-- ===================================================== -->
  <!-- OUTER BORDER                                          -->
  <!-- ===================================================== -->

  <rect
    x="20"
    y="20"
    width="960"
    height="900"
    rx="22"
    fill="none"
    stroke="#f5e7c5"
    stroke-width="3"
    opacity=".9"
  />

</svg>
